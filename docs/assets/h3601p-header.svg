<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">ZTE ZXHN H3601P — OpenWrt platform</title>
  <desc id="desc">Dual Cortex-A9 cores, ZX279128S packet processing, MT7916 Wi-Fi 6, and 167 MiB persistent overlay. Independent port by wmemcmp.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081b2e"/><stop offset="1" stop-color="#10283a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
  </defs>
  <rect width="1400" height="470" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#18384c" stroke-width="1">
    <path d="M0 72h1400M0 144h1400M0 216h1400M0 288h1400M0 360h1400M0 432h1400"/>
    <path d="M70 0v470M210 0v470M350 0v470M490 0v470M630 0v470M770 0v470M910 0v470M1050 0v470M1190 0v470M1330 0v470"/>
  </g>
  <rect x="54" y="45" width="5" height="139" rx="2" fill="url(#accent)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="66" fill="#5eead4" font-size="17" font-weight="700" letter-spacing="3">INDEPENDENT OPENWRT PORT</text>
    <text x="76" y="127" fill="#f8fafc" font-size="53" font-weight="700" letter-spacing="-1">ZTE ZXHN H3601P</text>
    <text x="80" y="168" fill="#b5c9da" font-size="22">From silicon bring-up to a persistent, LuCI-managed system.</text>
    <rect x="1104" y="51" width="240" height="43" rx="21" fill="#123d4c" stroke="#286278"/>
    <text x="1224" y="78" fill="#90f1df" font-size="16" font-weight="700" text-anchor="middle">r241 · NORMAL IMAGE</text>
  </g>
  <g fill="#102d40" stroke="#2a4c61">
    <rect x="56" y="220" width="310" height="151" rx="14"/>
    <rect x="382" y="220" width="310" height="151" rx="14"/>
    <rect x="708" y="220" width="310" height="151" rx="14"/>
    <rect x="1034" y="220" width="310" height="151" rx="14"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#70d6e3" font-size="14" font-weight="700" letter-spacing="2">
      <text x="80" y="252">CPU / MEMORY</text><text x="406" y="252">PACKET PROCESSING</text>
      <text x="732" y="252">WIRELESS</text><text x="1058" y="252">PERSISTENT STORAGE</text>
    </g>
