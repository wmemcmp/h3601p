      <text x="732" y="298">MT7916 · Wi-Fi 6</text><text x="1058" y="298">167 MiB overlay</text>
    </g>
    <g fill="#afc4d5" font-size="17">
      <text x="80" y="337">1 GHz · SMP · 256 MiB RAM</text><text x="406" y="337">TM · CLA / NAT · IDM DMA</text>
      <text x="732" y="337">Dual band · Dual PCIe HIF</text><text x="1058" y="337">SquashFS + JFFS2 in-band</text>
    </g>
